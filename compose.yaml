services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: phone
      POSTGRES_USER: phone_admin
      POSTGRES_PASSWORD: local-admin
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/local-init.sql:/docker-entrypoint-initdb.d/01-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U phone_admin -d phone"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
